[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readsb-feed-dashboard"
version = "2.0.0"
description = "Terminal dashboard for monitoring multi-readsb ADS-B setups"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Louis"},
]
dependencies = [
    "rich>=13.0",
]

[project.scripts]
readsb-feed-dashboard = "readsb_feed_dashboard.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
